<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts - Outfit for headings, Karla for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
  
  <script src="tailwind.js"></script>
  <link rel="stylesheet" href="app.css">
</head>
<body class="pattern-bg">
  <!-- Spotlight Search -->
  <div id="spotlight-backdrop" class="spotlight-backdrop"></div>
  <div id="spotlight-container" class="spotlight-container">
    <div class="relative">
      <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-charcoal/40 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input 
        type="text" 
        id="spotlight-input" 
        class="spotlight-input" 
        placeholder="Search links..." 
        autocomplete="off"
      >
    </div>
    <div id="spotlight-results" class="spotlight-results" tabindex="0"></div>
  </div>

  <div class="container mx-auto px-4 py-12 max-w-6xl">
    <!-- Header -->
    <header class="text-center mb-16 animate-in">
      <h1 class="font-heading text-5xl font-bold text-charcoal mb-3 tracking-tight">
        Quick Links
      </h1>
    </header>
    
    <!-- Links Container -->
    <main id="links-container" class="space-y-12">
      <!-- Categories will be rendered here by JavaScript -->
    </main>
    
    <!-- Footer -->
    <footer class="mt-16 text-center text-charcoal/40 text-sm animate-in" style="animation-delay: 0.8s;">
      <p>Press <kbd class="px-2 py-1 bg-white/50 rounded text-xs font-mono">Ctrl</kbd> + <kbd class="px-2 py-1 bg-white/50 rounded text-xs font-mono">/</kbd> to search</p>
    </footer>
  </div>

  <!-- Load links data and app logic -->
  <script src="links.js"></script>
  <script src="render.js"></script>
  <script src="spotlight.js"></script>
</body>
</html>
