<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              heading: ['Outfit', 'sans-serif'],
              body: ['Karla', 'sans-serif'],
            },
            colors: {
              cream: '#FDF8F3',
              sand: '#F5EBE0',
              terracotta: '#C9705F',
              rust: '#A0522D',
              moss: '#5D7052',
              charcoal: '#2D2D2D',
            }
          }
        }
      }
  </script>
  
  <!-- Google Fonts - Outfit for headings, Karla for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://www.google.com"> <!-- For favicons -->
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" href="./img/favicon.ico" type="image/x-icon">
  
  <link rel="stylesheet" href="app.css">
</head>
<body class="pattern-bg">
  <!-- Spotlight Search -->
  <div id="spotlight-backdrop" class="spotlight-backdrop"></div>
  <div id="spotlight-container" class="spotlight-container">
    <div class="relative">
      <svg class="absolute left-5 top-1/2 -translate-y-1/2 w-5 h-5 text-charcoal/40 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
      </svg>
      <input 
        type="text" 
        id="spotlight-input" 
        class="spotlight-input" 
        placeholder="Search links..." 
        autocomplete="off"
      >
    </div>
    <div id="spotlight-results" class="spotlight-results" tabindex="0"></div>
  </div>

  <div class="w-full">
    <!-- Quick Nav -->
    <nav id="quick-nav" class="quick-nav flex justify-center" aria-label="Category navigation">
      <!-- Generated by render.js -->
    </nav>

    <!-- Header -->
    <header class="text-center mb-16 animate-in pt-12">
      <h1 class="font-heading text-5xl font-bold text-charcoal mb-3 tracking-tight">
        Quick Links
      </h1>
    </header>
    
  
    
    <!-- Links Container -->
    <main id="links-container" class="max-w-8xl mx-auto px-4 ">
      <!-- Categories will be rendered here by JavaScript -->
    </main>
    
    <!-- Footer -->
    <footer class="fixed bottom-4 right-4 max-w-2xl mx-auto text-center text-charcoal/40 text-sm animate-in" style="animation-delay: 0.8s;">
      <p class="max-w-xl flex items-center justify-center gap-2 mx-auto p-4 bg-sand/80 rounded-lg hover:bg-sand/100 hover:shadow-lg transition-colors transition-shadow duration-300 cursor-pointer" onclick="openSpotlight()">
        <svg height="16" width="16" data-slot="icon" aria-hidden="true" fill="none" stroke-width="1.5" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          Press <kbd class="px-2 py-1 bg-white rounded text-xs font-mono">Ctrl</kbd> + <kbd class="px-2 py-1 bg-white/50 rounded text-xs font-mono">/</kbd> to search</p>
    </footer>
  </div>

  <!-- Templates for performance (cloning is faster than innerHTML parsing) -->
  <template id="link-card-template">
    <a class="link-card block bg-white rounded-2xl p-5 shadow-sm border border-sand/50 animate-in" target="_blank" rel="noopener noreferrer">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-xl bg-sand/50 flex items-center justify-center flex-shrink-0 overflow-hidden" data-favicon-container>
          <img alt="" class="favicon-img w-7 h-7 object-contain" loading="lazy">
        </div>
        <div class="min-w-0 flex-1">
          <h3 class="font-heading font-semibold text-charcoal text-lg truncate" data-title></h3>
          <p class="text-charcoal/50 text-sm truncate" data-description></p>
        </div>
        <svg class="w-5 h-5 text-charcoal/30 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
      </div>
    </a>
  </template>

  <!-- Load links data and app logic -->
  <script src="links.js"></script>
  <script src="render.js"></script>
  <script src="spotlight.js"></script>
</body>
</html>
