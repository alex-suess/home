<!-- Spotlight Search Modal -->
<app-spotlight />

<main class="min-h-screen pattern-bg">
  <!-- Quick Navigation -->
  <div class="fixed top-0 left-0 right-0 z-50">
    <app-quick-nav />
  </div>
  
  
  <div class="px-4 sm:px-6 lg:px-8 py-12">
    
    <!-- Category Sections -->
    @for (category of categories(); track trackCategory($index, category)) {
      <app-category-section 
        [category]="category"
        [categoryIndex]="$index"
      />
    } @empty {
      <div class="empty-state text-center py-16 animate-in" style="animation-delay: 0.1s">
        <div class="text-6xl mb-4">📭</div>
        <p class="text-charcoal/50 text-lg">No links found. Add some links to get started.</p>
      </div>
    }
  </div>
  
  <!-- Footer -->
  <div class="footer-actions fixed bottom-2 right-2 z-40 animate-in" style="animation-delay: 0.3s">
    <button
      type="button"
      class="bookmark-export-btn"
      (click)="exportFirefoxBookmarks()"
      aria-label="Export bookmarks as Firefox JSON backup"
    >
      Export Firefox bookmarks
    </button>
    <footer class="footer-section rounded-lg text-center px-6 py-4 text-charcoal/40 text-sm font-karla backdrop-blur-xl">
      <p>Press <kbd class="kbd-key-small">Ctrl</kbd> + <kbd class="kbd-key-small">/</kbd> anywhere to search</p>
    </footer>
  </div>
</main>
