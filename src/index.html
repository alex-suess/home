<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Home - Link Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Personal link dashboard for quick access to frequently used sites">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Google Fonts - Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="pattern-bg">
  <!-- GitHub Pages SPA redirect handler -->
  <script>
    (function() {
      var redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) {
        // Ensure restored route is absolute to avoid "/home/home/..." on GitHub Pages.
        history.replaceState(null, null, '/' + redirect.replace(/^\/+/, ''));
      }
    })();
  </script>
  <app-root></app-root>
</body>
</html>
